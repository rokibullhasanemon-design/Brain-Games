<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /*element selector*/
        .red {
            background-color: red;
            color: white;
        }
        #blue {
            background-color: blue;
            color: white;
        }

        div > p{
         background-color: rgb(0, 255, 47);
        line-height: 1.5;
    }
        /*universal selector*/
    * {
        margin: 10;
        padding: 10;
    }
   /* pseudo selector*/
      a:link {
    color: blue;
}

a:visited {
    color: yellow;
}

a:hover {
    color: green;
}

a:active {
    color: red;
}
p:first-child {
    font-weight: bold;
}
    </style>
    
</head>
<body>
    <main class="one">
        <p>Iam the first child </p>
        <p>iam the second child</p>
    <div class="red">
        <h1>Hello, World!</h1>
        <p>This is a simple HTML page.</p>
    </div>
    <div id="blue">
        <h2>Welcome to My Website</h2>
        <p>This is another section of the page.</p>
    </div>
    <a href="https://www.airbnb.com" target="_blank">Visit Airbnb</a>
    <a href="https://www.facebook.com" target="_blank">Visit Facebook</a>
</body>
</html>
